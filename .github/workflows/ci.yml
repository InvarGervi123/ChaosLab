name: ChaosLab CI

on:
  push:
  pull_request:

jobs:
  build-scan-and-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Build image under test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.secure
          push: false
          load: true
          tags: chaos-nginx:secure

      - name: Scan exact image under test (fail on HIGH or CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 chaos-nginx:secure

      - name: Export tested image for local deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save chaos-nginx:secure -o chaos-nginx-secure.tar
          sha256sum chaos-nginx-secure.tar > chaos-nginx-secure.tar.sha256

      - name: Upload tested image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: chaoslab-tested-image
          path: |
            chaos-nginx-secure.tar
            chaos-nginx-secure.tar.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Start scanned image
        run: docker run -d --name chaos-web -p 8080:80 chaos-nginx:secure

      - name: Verify self-healing against scanned image
        run: bash tests/self-healing.sh

  application-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend syntax
        run: |
          for file in backend/*.js; do
            node --check "$file"
          done

      - name: Run backend API and security integration tests
        run: npm test --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
