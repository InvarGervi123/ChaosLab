name: ChaosLab CI

on:
  push:
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build secure image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.secure
          push: false
          load: true
          tags: chaos-nginx:secure
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 chaos-nginx:secure

  self-healing-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Start test container
        run: docker run -d --name chaos-web -p 8080:80 nginx:alpine
      - name: Run self-healing test
        run: bash tests/self-healing.sh
