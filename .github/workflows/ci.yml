name: ChaosLab CI

on:
  push:
  pull_request:

jobs:
  build-scan-and-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Build image under test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.secure
          push: false
          load: true
          tags: chaos-nginx:secure

      - name: Scan exact image under test (fail on HIGH or CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 chaos-nginx:secure

      - name: Export tested image for local deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save chaos-nginx:secure -o chaos-nginx-secure.tar
          sha256sum chaos-nginx-secure.tar > chaos-nginx-secure.tar.sha256

      - name: Upload tested image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: chaoslab-tested-image
          path: |
            chaos-nginx-secure.tar
            chaos-nginx-secure.tar.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Start scanned image
        run: docker run -d --name chaos-web -p 8080:80 chaos-nginx:secure

      - name: Verify self-healing against scanned image
        run: bash tests/self-healing.sh

      - name: Verify rollback after failed promotion (isolated containers)
        run: bash tests/cd-rollback.sh

  application-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify CI approval gate rejects failed, pending and stale runs
        run: bash tests/cd-approval-gate.sh

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend syntax
        run: |
          for file in backend/*.js; do
            node --check "$file"
          done

      - name: Run backend API and security integration tests
        run: npm test --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  isolated-lab-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launch disposable three-service infrastructure lab
        run: docker compose -f lab/compose.yaml -p chaoslab-lab up -d --build
      - name: Verify real dependency and safe failure recovery
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health | grep -q '"status":"healthy"'; then
              break
            fi
            sleep 2
          done
          curl -fsS --max-time 2 http://127.0.0.1:18080/health | grep -q '"databaseConnection":"available"'
          docker inspect chaoslab-lab-api --format '{{ index .Config.Labels "dev.chaoslab.sandbox" }}' | grep -qx true
          docker stop chaoslab-lab-api
          sleep 2
          status="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)"
          if [[ "$status" == "200" ]]; then
            echo "Proxy unexpectedly returned success after upstream API was stopped" >&2
            exit 1
          fi
          docker start chaoslab-lab-api
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health | grep -q '"status":"healthy"'; then
              echo "PASS: genuine dependency and recovery verified"
              exit 0
            fi
            sleep 2
          done
          echo "Lab API recovery failed" >&2
          exit 1
      - name: Cleanup disposable lab
        if: always()
        run: docker compose -f lab/compose.yaml -p chaoslab-lab down --remove-orphans
