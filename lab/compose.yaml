name: chaoslab-lab
services:
  proxy:
    image: nginx:1.27-alpine
    container_name: chaoslab-lab-proxy
    labels:
      dev.chaoslab.sandbox: "true"
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - sandbox
      - ingress
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 2

  api:
    build: ./api
    container_name: chaoslab-lab-api
    labels:
      dev.chaoslab.sandbox: "true"
    environment:
      DB_HOST: db
      DB_PASSWORD: ${LAB_DB_PASSWORD:-disposable-lab-only}
    depends_on:
      - db
    networks:
      - sandbox
    mem_limit: 96m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 2

  db:
    image: postgres:16-alpine
    container_name: chaoslab-lab-db
    labels:
      dev.chaoslab.sandbox: "true"
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-disposable-lab-only}
    tmpfs:
      - /var/lib/postgresql/data:size=64m,mode=0700
    networks:
      - sandbox
    mem_limit: 160m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 2s
      retries: 3

networks:
  sandbox:
    name: chaoslab-lab-sandbox
    internal: true
  ingress:
    name: chaoslab-lab-ingress
